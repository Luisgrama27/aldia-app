<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Al Día</title>
    <meta name="description" content="Controla los vencimientos de tus productos del hogar" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040506" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Al Día" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* Fondo de toda la pantalla (incluida la zona segura del iPhone) = fondo de la app */
      html, body { width: 100%; height: 100%; background: #f4f4f5; overscroll-behavior: none; }
      body { overflow: hidden; -webkit-font-smoothing: antialiased; }
      #root { position: fixed; inset: 0; overflow: hidden; background: #f4f4f5; }

      @media (prefers-color-scheme: dark) {
        html, body { background: #040506; }
        #root { background: #040506; }
      }

      #native-splash {
        --s-bg: #f4f4f5; --s-ink: #07080a; --s-ink2: #55565a; --s-tile: #ffffff;
        --s-line: rgba(7,8,10,0.12); --s-green: #13794a; --s-dot: rgba(7,8,10,0.2);
        --s-glow: rgba(217,58,64,0.16); --s-glow2: rgba(26,95,208,0.12);
        position: fixed; inset: 0; background: var(--s-bg); overflow: hidden;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 99999; gap: 18px; transition: opacity 0.4s ease;
        font-family: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #native-splash {
          --s-bg: #040506; --s-ink: #ffffff; --s-ink2: #9c9c9d; --s-tile: #07080a;
          --s-line: rgba(255,255,255,0.12); --s-green: #59d499; --s-dot: rgba(255,255,255,0.25);
          --s-glow: rgba(255,99,99,0.28); --s-glow2: rgba(99,161,255,0.18);
        }
      }
      #native-splash.hidden { opacity: 0; pointer-events: none; }

      #native-splash .blob {
        position: absolute; border-radius: 50%;
        opacity: 0; animation: splashFade 0.8s ease 0.1s forwards;
      }
      #native-splash .blob.b1 { width: 420px; height: 420px; top: -170px; right: -160px; background: radial-gradient(circle, var(--s-glow) 0%, transparent 68%); }
      #native-splash .blob.b2 { width: 360px; height: 360px; bottom: -150px; left: -140px; background: radial-gradient(circle, var(--s-glow2) 0%, transparent 68%); }

      #native-splash .logo {
        width: 112px; height: 112px;
        background: var(--s-tile); color: var(--s-green);
        border: 1px solid var(--s-line); border-radius: 28px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 16px 40px rgba(0,0,0,0.25);
        animation: splashPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
      }
      #native-splash .title {
        font-size: 36px; font-weight: 600; color: var(--s-ink); letter-spacing: -0.02em;
        opacity: 0; transform: translateY(16px);
        animation: splashFade 0.5s ease 0.5s forwards;
      }
      #native-splash .sub {
        font-size: 15px; color: var(--s-ink2); margin-top: -10px;
        opacity: 0; animation: splashFade 0.5s ease 0.7s forwards;
      }

      #native-splash .chip {
        position: absolute; display: flex; align-items: center; gap: 8px;
        padding: 9px 14px; background: var(--s-tile); color: var(--s-ink);
        border: 1px solid var(--s-line); border-radius: 12px; font-size: 13px; font-weight: 500;
        box-shadow: 0 8px 22px rgba(0,0,0,0.18);
        opacity: 0; animation: chipIn 0.6s ease forwards;
      }
      #native-splash .chip i { width: 10px; height: 10px; border-radius: 50%; display: block; }
      #native-splash .chip.c1 { --r: -6deg; top: 16%; left: 7%; animation-delay: 0.9s; }
      #native-splash .chip.c2 { --r: 5deg; bottom: 24%; right: 6%; animation-delay: 1.1s; }
      #native-splash .chip.c1 i { background: #f0b429; }
      #native-splash .chip.c2 i { background: var(--s-green); }

      #native-splash .dots {
        position: absolute;
        bottom: calc(50px + env(safe-area-inset-bottom, 0px));
        display: flex; gap: 8px; opacity: 0;
        animation: splashFade 0.5s ease 1.1s forwards;
      }
      #native-splash .dot { height: 8px; border-radius: 999px; background: var(--s-dot); }
      #native-splash .dot.active { width: 24px; background: var(--s-ink); }
      #native-splash .dot:not(.active) { width: 8px; }

      @keyframes splashPop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splashFade { to { opacity: 1; transform: translateY(0); } }
      @keyframes chipIn {
        from { opacity: 0; transform: translateY(14px) rotate(var(--r)); }
        to { opacity: 1; transform: translateY(0) rotate(var(--r)); }
      }
    </style>
  </head>
  <body>
    <div id="native-splash">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="chip c1"><i></i>Leche · 3 días</div>
      <div class="chip c2"><i></i>Mermelada · 45 días</div>
      <div class="logo">
        <svg width="78" height="78" viewBox="0 0 80 80" aria-hidden="true">
          <path d="M40 14 C40 14 56 25 56 38 C56 50 48 58 40 61 C32 58 24 50 24 38 C24 25 40 14 40 14Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <polyline points="32,38 38,44 49,31" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 55 Q40 49 58 55" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
        </svg>
      </div>
      <div class="title">Al Día</div>
      <div class="sub">Controla lo que tienes en casa</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend', e => e.preventDefault());
      window.__hideSplash = function() {
        const s = document.getElementById('native-splash');
        if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 400); }
      };
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW error:', e));
        });
      }
    </script>
  </body>
</html>
