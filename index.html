<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Al Día</title>
    <script>
      /* Aplica el tema guardado antes de pintar, para que la pantalla de carga ya salga con él */
      try { var t = localStorage.getItem('tema_app'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch (e) {}
    </script>
    <meta name="description" content="Controla los vencimientos de tus productos del hogar" />
    <meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Al Día" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* Variables de la pantalla de carga (mismos valores que en index.css) */
      :root {
        --s-bg: #f4f5f6; --s-card: #ffffff; --s-text: #131517; --s-text2: #66686a;
        --s-green: #2f6b4f; --s-logo-ink: #ffffff; --s-line: rgba(19,21,23,0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-tema="claro"]) {
          --s-bg: #0e0f11; --s-card: #17191b; --s-text: #f4f5f6; --s-text2: #a2a4a6;
          --s-green: #5cc08d; --s-logo-ink: #06150d; --s-line: rgba(244,245,246,0.14);
        }
      }
      :root[data-tema="oscuro"] {
        --s-bg: #0e0f11; --s-card: #17191b; --s-text: #f4f5f6; --s-text2: #a2a4a6;
        --s-green: #5cc08d; --s-logo-ink: #06150d; --s-line: rgba(244,245,246,0.14);
      }

      /* Fondo de toda la pantalla (incluida la zona segura del iPhone) = fondo de la app */
      html, body { width: 100%; height: 100%; background: var(--s-bg); overscroll-behavior: none; }
      body { overflow: hidden; -webkit-font-smoothing: antialiased; }
      #root { position: fixed; inset: 0; overflow: hidden; background: var(--s-bg); }

      #native-splash {
        position: fixed; inset: 0; background: var(--s-bg); overflow: hidden;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 99999; gap: 18px; transition: opacity 0.4s ease;
        font-family: 'Manrope Variable', 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.018em;
      }
      #native-splash.hidden { opacity: 0; pointer-events: none; }

      #native-splash .logo {
        width: 112px; height: 112px;
        background: var(--s-green); color: var(--s-logo-ink);
        border: 0; border-radius: 36px;
        display: flex; align-items: center; justify-content: center;
        animation: splashPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
      }
      #native-splash .title {
        font-size: 40px; font-weight: 700; color: var(--s-text); letter-spacing: -0.035em;
        opacity: 0; transform: translateY(16px);
        animation: splashFade 0.5s ease 0.5s forwards;
      }
      #native-splash .sub {
        font-size: 12px; font-weight: 500; letter-spacing: 0.083em; text-transform: uppercase;
        color: var(--s-text2); margin-top: -10px;
        opacity: 0; animation: splashFade 0.5s ease 0.7s forwards;
      }

      #native-splash .dots {
        position: absolute;
        bottom: calc(50px + env(safe-area-inset-bottom, 0px));
        display: flex; gap: 8px; opacity: 0;
        animation: splashFade 0.5s ease 1.1s forwards;
      }
      #native-splash .dot { height: 8px; border-radius: 999px; background: var(--s-line); }
      #native-splash .dot.active { width: 24px; background: var(--s-green); }
      #native-splash .dot:not(.active) { width: 8px; }

      @keyframes splashPop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splashFade { to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <div id="native-splash">
      
      <div class="logo">
        <svg width="78" height="78" viewBox="0 0 80 80" aria-hidden="true">
          <path d="M40 14 C40 14 56 25 56 38 C56 50 48 58 40 61 C32 58 24 50 24 38 C24 25 40 14 40 14Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <polyline points="32,38 38,44 49,31" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 55 Q40 49 58 55" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
        </svg>
      </div>
      <div class="title">Al Día</div>
      <div class="sub">Controla lo que tienes en casa</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend', e => e.preventDefault());
      window.__hideSplash = function() {
        const s = document.getElementById('native-splash');
        if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 400); }
      };
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW error:', e));
        });
      }
    </script>
  </body>
</html>
