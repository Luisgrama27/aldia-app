<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Al Día</title>
    <script>
      /* Aplica el tema guardado antes de pintar, para que la pantalla de carga ya salga con él */
      try { var t = localStorage.getItem('tema_app'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch (e) {}
    </script>
    <meta name="description" content="Controla los vencimientos de tus productos del hogar" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al Día" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="Al Día · Controla tus vencimientos" />
    <meta property="og:description" content="Registra tus productos, recibe avisos antes de que se venzan y evita desperdicios." />
    <meta property="og:image" content="https://aldia-app-nine.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Al Día sobre fondo verde" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Al Día" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* Variables de la pantalla de carga (mismos valores que en index.css) */
      :root {
        --s-bg: #f4f5f6; --s-card: #ffffff; --s-text: #131517; --s-text2: #66686a;
        --s-green: #2f6b4f; --s-logo-ink: #ffffff; --s-line: rgba(19,21,23,0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-tema="claro"]) {
          --s-bg: #0e0f11; --s-card: #17191b; --s-text: #f4f5f6; --s-text2: #a2a4a6;
          --s-green: #5cc08d; --s-logo-ink: #06150d; --s-line: rgba(244,245,246,0.14);
        }
      }
      :root[data-tema="oscuro"] {
        --s-bg: #0e0f11; --s-card: #17191b; --s-text: #f4f5f6; --s-text2: #a2a4a6;
        --s-green: #5cc08d; --s-logo-ink: #06150d; --s-line: rgba(244,245,246,0.14);
      }

      /* Fondo de toda la pantalla (incluida la zona segura del iPhone) = fondo de la app */
      html, body { width: 100%; height: 100%; background: var(--s-bg); overscroll-behavior: none; }
      body { overflow: hidden; -webkit-font-smoothing: antialiased; }
      #root { position: fixed; inset: 0; overflow: hidden; background: var(--s-bg); }

      /* Pantalla de carga: mismo lenguaje que la app (resplandor verde, logo con gradiente y halo) */
      :root {
        --s-a1: rgba(58, 138, 98, 0.52); --s-a2: rgba(120, 196, 152, 0.40); --s-a3: rgba(47, 107, 79, 0.32);
        --s-title-a: #1f4a37; --s-title-b: #3a8a62; --s-halo: rgba(47, 107, 79, 0.10);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-tema="claro"]) {
          --s-a1: rgba(70, 165, 120, 0.42); --s-a2: rgba(60, 140, 100, 0.32); --s-a3: rgba(47, 107, 79, 0.36);
          --s-title-a: #eaf6ef; --s-title-b: #8fd0ac; --s-halo: rgba(92, 192, 141, 0.12);
        }
      }
      :root[data-tema="oscuro"] {
        --s-a1: rgba(70, 165, 120, 0.42); --s-a2: rgba(60, 140, 100, 0.32); --s-a3: rgba(47, 107, 79, 0.36);
        --s-title-a: #eaf6ef; --s-title-b: #8fd0ac; --s-halo: rgba(92, 192, 141, 0.12);
      }

      #native-splash {
        position: fixed; inset: 0; background: var(--s-bg); overflow: hidden;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 99999; gap: 18px; transition: opacity 0.4s ease, transform 0.4s ease;
        font-family: 'Manrope Variable', 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.018em;
      }
      #native-splash.hidden { opacity: 0; transform: scale(1.03); pointer-events: none; }

      /* Resplandor de fondo: se desvanece arriba y abajo para fundirse con las franjas del sistema */
      #native-splash::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 120px, #000 calc(100% - 110px), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 120px, #000 calc(100% - 110px), transparent 100%);
        background:
          radial-gradient(560px 460px at 108% -4%, var(--s-a1), transparent 65%),
          radial-gradient(480px 420px at -14% 38%, var(--s-a2), transparent 65%),
          radial-gradient(560px 400px at 55% 108%, var(--s-a3), transparent 70%);
        animation: splashGlow 1.2s ease 0.1s forwards;
      }

      #native-splash .logo {
        position: relative;
        width: 112px; height: 112px; border-radius: 36px;
        background: linear-gradient(145deg, #3f9669, #2f6b4f 55%, #25573f);
        color: var(--s-logo-ink);
        box-shadow: 0 22px 44px -14px rgba(47, 107, 79, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.28);
        display: flex; align-items: center; justify-content: center;
        animation: splashPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #native-splash .logo::before {
        content: ""; position: absolute; inset: -14px; z-index: -1; border-radius: 48px;
        background: var(--s-halo); opacity: 0;
        animation: splashBreath 2.6s ease-in-out 0.9s infinite;
      }
      #native-splash .leaf, #native-splash .tick {
        stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
      }
      #native-splash .leaf { animation: splashDraw 0.7s ease 0.35s forwards; }
      #native-splash .tick { animation: splashDraw 0.45s ease 0.95s forwards; }
      #native-splash .wave { opacity: 0; animation: splashWave 0.4s ease 0.9s forwards; }

      #native-splash .title {
        font-size: 40px; font-weight: 700; letter-spacing: -0.035em;
        background: linear-gradient(120deg, var(--s-title-a), var(--s-title-b) 75%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        opacity: 0; transform: translateY(16px);
        animation: splashFade 0.5s ease 0.8s forwards;
      }
      #native-splash .sub {
        font-size: 12px; font-weight: 500; letter-spacing: 0.083em; text-transform: uppercase;
        color: var(--s-text2); margin-top: -10px;
        opacity: 0; animation: splashFade 0.5s ease 1s forwards;
      }

      /* Barra de carga fina (reemplaza los tres puntos, que no indicaban nada) */
      #native-splash .load {
        position: absolute; bottom: calc(56px + env(safe-area-inset-bottom, 0px));
        width: 96px; height: 4px; border-radius: 999px; overflow: hidden;
        background: var(--s-line); opacity: 0;
        animation: splashFade 0.5s ease 1.2s forwards;
      }
      #native-splash .load::after {
        content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #3f9669, #2f6b4f);
        animation: splashSlide 1.2s ease-in-out infinite;
      }

      @keyframes splashPop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splashFade { to { opacity: 1; transform: translateY(0); } }
      @keyframes splashGlow { to { opacity: 1; } }
      @keyframes splashDraw { 0% { opacity: 0; stroke-dashoffset: 1; } 4% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
      @keyframes splashWave { to { opacity: 0.6; } }
      @keyframes splashBreath { 0%, 100% { opacity: 0.35; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes splashSlide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

      /* Si la persona pide menos movimiento, se muestra directamente el resultado final */
      @media (prefers-reduced-motion: reduce) {
        #native-splash, #native-splash * , #native-splash::before { animation: none !important; transition: none !important; }
        #native-splash::before, #native-splash .title, #native-splash .sub, #native-splash .load { opacity: 1; transform: none; }
        #native-splash .leaf, #native-splash .tick { stroke-dashoffset: 0; opacity: 1; }
        #native-splash .wave { opacity: 0.6; }
        #native-splash .logo::before { opacity: 0.6; }
        #native-splash .load::after { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="native-splash">
      <div class="logo">
        <svg width="78" height="78" viewBox="0 0 80 80" aria-hidden="true">
          <path class="leaf" pathLength="1" d="M40 14 C40 14 56 25 56 38 C56 50 48 58 40 61 C32 58 24 50 24 38 C24 25 40 14 40 14Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <polyline class="tick" pathLength="1" points="32,38 38,44 49,31" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="wave" d="M22 55 Q40 49 58 55" stroke="currentColor" stroke-width="1.8" fill="none"/>
        </svg>
      </div>
      <div class="title">Al Día</div>
      <div class="sub">Controla lo que tienes en casa</div>
      <div class="load" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend', e => e.preventDefault());
      window.__hideSplash = function() {
        const s = document.getElementById('native-splash');
        if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 400); }
      };
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW error:', e));
        });
      }
    </script>
  </body>
</html>
